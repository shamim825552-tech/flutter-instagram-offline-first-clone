name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Create env files
        run: |
          for dir in . packages/env; do
            for name in .env .env.dev .env.development .env.prod .env.production; do
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> "$dir/$name"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> "$dir/$name"
              echo "POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}" >> "$dir/$name"
              echo "FCM_SERVER_KEY=placeholder" >> "$dir/$name"
              echo "IOS_CLIENT_ID=placeholder" >> "$dir/$name"
              echo "WEB_CLIENT_ID=placeholder" >> "$dir/$name"
            done
          done
        continue-on-error: true

      - name: Create placeholder google-services.json
        run: |
          cat > android/app/google-services.json << 'JSONEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.emilzulufov.flutter_instagram_offline_first_clone"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "placeholder-api-key" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSONEOF

      - name: Use debug signing for release build (temporary)
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle

      - name: Build env package
        run: |
          cd packages/env
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: DEBUG - Show generated env file
        run: |
          echo "===== env.prod.g.dart ====="
          cat packages/env/lib/src/env.prod.g.dart || echo "FILE NOT FOUND"
          echo "===== env.dev.g.dart ====="
          cat packages/env/lib/src/env.dev.g.dart || echo "FILE NOT FOUND"

      - name: Install root dependencies
        run: flutter pub get

      - name: Run build_runner in root (main app)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --flavor production -t lib/main_production.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk
