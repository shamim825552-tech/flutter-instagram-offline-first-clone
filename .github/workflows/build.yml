name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Create env files
        run: |
          for dir in . packages/env; do
            for name in .env .env.dev .env.development .env.prod .env.production; do
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> "$dir/$name"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> "$dir/$name"
              echo "POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}" >> "$dir/$name"
              echo "FCM_SERVER_KEY=placeholder" >> "$dir/$name"
              echo "IOS_CLIENT_ID=placeholder" >> "$dir/$name"
              echo "WEB_CLIENT_ID=placeholder" >> "$dir/$name"
            done
          done
        continue-on-error: true

      - name: Add google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
        continue-on-error: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos bootstrap

      - name: Run build_runner in env package
        run: |
          cd packages/env
          dart run build_runner build --delete-conflicting-outputs

      - name: Run build_runner in root (main app)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --flavor production -t lib/main_production.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk
